[project]
name = "pollution-pipeline"
version = "0.0.1"
description = "Data pipeline for the Pollution Analyst.ai trend platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "shapely>=2.0",
    "pyreadr>=0.5",  # reads blockgroupstats.rda from EJAM-open for raw EJ indicators
    "openpyxl>=3.1",  # streaming read of AirToxScreen 2020 RegionN_CancerRisk_by_block_poll.xlsx
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
